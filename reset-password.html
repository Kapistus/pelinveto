<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aseta uusi salasana - Pelinvetovuorot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}
.auth-container {
    max-width: 400px;
    margin: 100px auto;
    background: white;
    padding: 40px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h2 { color: #333; margin-bottom: 20px; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 500;
}
button:hover { background: #1d4ed8; }
.error { background: #fee; color: #c00; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
.success { background: #efe; color: #060; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="auth-container">
    <h2>Aseta uusi salasana</h2>
    <div id="resetMessage"></div>
    <form id="resetForm">
        <div class="form-group">
            <label>Uusi salasana (vähintään 6 merkkiä)</label>
            <input type="password" id="newPassword" required minlength="6">
        </div>
        <div class="form-group">
            <label>Vahvista salasana</label>
            <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <button type="submit">Tallenna uusi salasana</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://kjbzmjombtqciljlewvu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqYnptam9tYnRxY2lsamxld3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1Njc0NDMsImV4cCI6MjA5NTE0MzQ0M30.JfvLhxgcZkcPptRjDHgVneGr0PHRWHc76NFTpkp7q78';
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMessage(elementId, message, type) {
    document.getElementById(elementId).innerHTML = `<div class="${type}">${message}</div>`;
}

let recoverySessionReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
        recoverySessionReady = true;
    }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!recoverySessionReady) {
        showMessage('resetMessage', 'Palautuslinkki on virheellinen tai vanhentunut. Pyydä uusi linkki.', 'error');
        return;
    }

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        showMessage('resetMessage', 'Salasanat eivät täsmää.', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
        showMessage('resetMessage', error.message, 'error');
    } else {
        showMessage('resetMessage', 'Salasana vaihdettu! Voit nyt kirjautua sisään.', 'success');
        setTimeout(() => {
            window.location.href = 'https://kapistus.github.io/pelinveto/';
        }, 2000);
    }
});
</script>
</body>
</html>
